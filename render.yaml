services:
  - type: web
    name: gst-bharat-api
    env: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disks:
      - name: gst-bharat-storage
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gst-bharat-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: EXPORT_DIR
        value: /var/data/exports
      - key: MAX_UPLOAD_MB
        value: 60
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: gst-bharat-db
    databaseName: gst_bharat
    user: gst_bharat
    plan: starter
